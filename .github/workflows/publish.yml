name: eve-kernel build

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch or ref to build"
                required: false
    pull_request: {}
    pull_request_review:
        types: [submitted]
    push:
        branches:
            - "eve-kernel-amd64-v6.1.112-generic"

env:
    base_branch: "refs/heads/eve-kernel-amd64-v6.1.112-generic"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            matrix:
                flavor: [core, hwe]
            fail-fast: false
            max-parallel: 2

        runs-on: self-hosted
        if: ${{ github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
            github.ref == env.base_branch ||
            github.event_name == 'pull_request' }}

        steps:
            - name: Set checkout reference
              id: set-ref
              run: |
                  if [ -n "${{ github.event.inputs.ref }}" ]; then
                    REF="${{ github.event.inputs.ref }}"
                  elif [ -n "${{ github.head_ref }}" ]; then
                    REF="${{ github.head_ref }}"
                  else
                    REF="${{ github.ref }}"
                  fi
                  echo "Using ref: $REF"
                  echo "ref_to_use=$REF" >> $GITHUB_OUTPUT

            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  ref: ${{ steps.set-ref.outputs.ref_to_use }}

            - name: Build eve-kernel-amd64 ${{ matrix.flavor | upper }}
              run: |
                  make -f Makefile.eve \
                    KERNEL_CONFIG_FLAVOR=${{ matrix.flavor }} \
                    BRANCH?=${GITHUB_REF##*/} \
                    kernel-gcc

            - name: Log in to Docker Hub
              if: ${{ github.ref == env.base_branch }}
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.RELEASE_DOCKERHUB_ACCOUNT }}
                  password: ${{ secrets.RELEASE_DOCKERHUB_TOKEN }}

            - name: Push ${{ matrix.flavor }} image
              if: ${{ github.ref == env.base_branch }}
              run: |
                  make -f Makefile.eve \
                    KERNEL_CONFIG_FLAVOR=${{ matrix.flavor }} \
                    BRANCH?=${GITHUB_REF##*/} \
                    push-gcc
