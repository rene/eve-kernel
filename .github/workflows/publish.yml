name: eve-kernel build

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch or ref to build"
                required: false
    pull_request: {}
    push:
        branches:
            - "eve-kernel-amd64-v6.1.112-generic"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            matrix:
                flavor: [core, hwe]
            fail-fast: false
            max-parallel: 2

        runs-on: self-hosted

        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/eve-kernel-amd64-v6.1.112-generic' }}

        steps:
            - name: Set constants
              id: constants
              run: |
                  BASE_BRANCH="refs/heads/eve-kernel-amd64-v6.1.112-generic"
                  SHORT_NAME="${BASE_BRANCH#refs/heads/}"
                  echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT
                  echo "short_name=$SHORT_NAME" >> $GITHUB_OUTPUT

            - name: Debug GitHub context
              run: |
                  echo "event_name: ${{ github.event_name }}"
                  echo "ref: ${{ github.ref }}"
                  echo "ref_name: ${{ github.ref_name }}"
                  echo "head_ref: ${{ github.head_ref }}"
                  echo "event.inputs.ref: ${{ github.event.inputs.ref }}"

            - name: Set checkout reference
              id: set-ref
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.ref }}" ]]; then
                    REF="${{ github.event.inputs.ref }}"
                  elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    REF="${{ github.head_ref }}"
                  else
                    REF="${{ github.ref_name }}"
                  fi
                  echo "Using ref: $REF"
                  echo "ref_to_use=$REF" >> $GITHUB_OUTPUT

            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  ref: ${{ steps.set-ref.outputs.ref_to_use }}

            - name: Build ${{ steps.constants.outputs.short_name }} - ${{ matrix.flavor }} kernel
              run: |
                  BRANCH=${{ steps.set-ref.outputs.ref_to_use }}
                  make -f Makefile.eve \
                    KERNEL_CONFIG_FLAVOR=${{ matrix.flavor }} \
                    BRANCH=$BRANCH \
                    kernel-gcc

            - name: Log in to Docker Hub
              if: ${{ github.ref == steps.constants.outputs.base_branch }}
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.RELEASE_DOCKERHUB_ACCOUNT }}
                  password: ${{ secrets.RELEASE_DOCKERHUB_TOKEN }}

            - name: Push ${{ matrix.flavor }} image for ${{ steps.constants.outputs.short_name }}
              if: ${{ github.ref == steps.constants.outputs.base_branch }}
              run: |
                  BRANCH=${{ steps.set-ref.outputs.ref_to_use }}
                  make -f Makefile.eve \
                    KERNEL_CONFIG_FLAVOR=${{ matrix.flavor }} \
                    BRANCH=$BRANCH \
                    push-gcc
